<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Bloc Party | Tickets</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="transparent.png" type="image/png">
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="logo.png" alt="Creative Bloc Party Logo" class="main-logo">
        </div>
        <p class="tagline">Mumbai • Pune • Bengaluru</p>
    </header>

    <main id="event-container">
        <div class="loader">
            <div class="spinner"></div>
            <p>Loading upcoming shows...</p>
        </div>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> Creative Bloc Party. Spoken Word & Beyond.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
