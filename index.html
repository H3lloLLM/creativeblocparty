<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Bloc Party | Tickets</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="transparent.png" type="image/png">
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="logo.png" alt="Creative Bloc Party Logo" class="main-logo">
        </div>
        <p class="tagline">Mumbai • Pune • Bengaluru</p>
    </header>

    <main>
        <!-- Permanent Action Buttons -->
        <div class="action-links-container">
            <a href="https://chat.whatsapp.com/KKj8B13SSgs0vvqdZP6Dee" target="_blank" class="action-btn whatsapp-btn">
                <span>Join WhatsApp Community</span>
            </a>
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSc2AgodCmCiaFfk3fGcjbLKa0XX50WVvgx0lLeaaXe6cnR-bg/viewform" target="_blank" class="action-btn form-btn">
                <span>Perform with Us (Artist Entry)</span>
            </a>
        </div>

        <!-- Dynamic Content Section -->
        <div id="event-container">
            <div class="loader">
                <div class="progress-bar">
                    <div class="progress-value"></div>
                </div>
                <p>Finding shows for you...</p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> Creative Bloc Party. Spoken Word & Beyond.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
